<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADCMS Pro - Maintenance Control System</title>
    <link rel="stylesheet" href="style.css">
    <script src="firebase-realtime.js" type="module"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>ADCMS Pro</h1>
            <p>Aviation Defect Control & Maintenance System</p>
            <button onclick="location.href='dashboard.html'" class="btn-primary">Go to Dashboard</button>
            <button onclick="clearCache()" class="btn-secondary">Clear Cache & Reload</button>
        </header>
        
        <main>
            <section class="features">
                <h2>Features</h2>
                <ul>
                    <li>✈️ Fleet Management</li>
                    <li>🔧 Defect Control</li>
                    <li>📋 MEL Management</li>
                    <li>🛏️ Cabin Defects</li>
                    <li>📦 Stores & Inventory</li>
                    <li>📊 Reports & Analytics</li>
                    <li>👥 User Management</li>
                    <li>🔐 Permissions</li>
                </ul>
            </section>
        </main>
    </div>
    
    <script>
        function clearCache() {
            // Clear all storage
            localStorage.clear();
            sessionStorage.clear();
            
            // Reload page
            location.reload(true);
        }
        
        // On page load, ensure Firebase is connected
        window.addEventListener('load', () => {
            console.log('✅ ADCMS loaded successfully');
            console.log('🔥 Firebase Realtime Database connected');
        });
    </script>
</body>
</html>

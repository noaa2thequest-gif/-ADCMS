<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADCMS — MCC Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo-container">
          <img src="assets/img/logo.png" alt="Sky Vision Airlines" class="company-logo">
          <div class="brand-credits">
            <span class="designer">Designed by: Eng. Hany Omar</span>
            <span class="reviewer">Reviewed by: Eng. Akram El-Gendy</span>
          </div>
        </div>
      </div>
      <nav id="mainNav"></nav>
    </aside>

    <main>
      <header>
        <button class="menu" id="menuBtn">☰</button>
        <div class="profile"><div class="avatar">H</div><div><strong>Hany Omar</strong><small>MCC Engineer</small></div></div>
      </header>

      <section class="content">
        <div class="section-head">
          <h2>🎛️ Maintenance Control Center (MCC)</h2>
          <p style="color: #64748b; margin: 5px 0 0 0; font-size: 14px;">Real-time fleet monitoring and MEL management</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;">
          <article style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #ef4444;">
            <div style="display: flex; align-items: center; gap: 15px;">
              <div style="font-size: 32px;">!</div>
              <div>
                <span style="color: #64748b; font-size: 12px;">AOG Defects</span>
                <strong id="counterAogDefects" style="font-size: 24px; color: #ef4444;">0</strong>
              </div>
            </div>
          </article>
          <article style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #f59e0b;">
            <div style="display: flex; align-items: center; gap: 15px;">
              <div style="font-size: 32px;">▤</div>
              <div>
                <span style="color: #64748b; font-size: 12px;">MEL Items</span>
                <strong id="counterMelItems" style="font-size: 24px; color: #f59e0b;">0</strong>
              </div>
            </div>
          </article>
          <article style="background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #10b981;">
            <div style="display: flex; align-items: center; gap: 15px;">
              <div style="font-size: 32px;">✈</div>
              <div>
                <span style="color: #64748b; font-size: 12px;">Fleet Health</span>
                <strong id="fleetHealth" style="font-size: 24px; color: #10b981;">100%</strong>
              </div>
            </div>
          </article>
        </div>

        <div class="section-head"><h3>Fleet Aircraft & MEL Management</h3></div>
        <div id="mccFleetList" style="display: grid; gap: 20px; margin-top: 20px;">
          <p style="text-align: center; padding: 40px; color: #888;">Loading fleet data...</p>
        </div>
      </section>
    </main>

    <!-- MEL Edit Modal -->
    <div id="melEditModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;">
      <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 600px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto;">
        <h3 style="margin-top: 0; color: #1e293b; border-bottom: 2px solid #f59e0b; padding-bottom: 12px;">MEL Management</h3>
        
        <div class="form-group" style="margin-bottom: 15px; margin-top: 20px;">
          <label style="display: block; margin-bottom: 8px; font-size: 13px; color: #64748b; font-weight: 600;">Aircraft</label>
          <input type="text" id="melEditAircraft" disabled style="width: 100%; padding: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; color: #1e293b; border-radius: 6px;">
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 8px; font-size: 13px; color: #64748b; font-weight: 600;">Defect Description</label>
          <input type="text" id="melEditDefect" disabled style="width: 100%; padding: 10px; background: #f1f5f9; border: 1px solid #e2e8f0; color: #1e293b; border-radius: 6px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <div class="form-group">
            <label style="display: block; margin-bottom: 8px; font-size: 13px; color: #64748b; font-weight: 600;">MEL Category</label>
            <select id="melEditCategory" style="width: 100%; padding: 10px; background: white; border: 1px solid #e2e8f0; color: #1e293b; border-radius: 6px;">
              <option value="A">Cat A</option>
              <option value="B">Cat B</option>
              <option value="C" selected>Cat C</option>
              <option value="D">Cat D</option>
              <option value="Connection 1">Connection 1</option>
              <option value="Connection 2">Connection 2</option>
            </select>
          </div>
          <div class="form-group">
            <label style="display: block; margin-bottom: 8px; font-size: 13px; color: #64748b; font-weight: 600;">MEL Reference</label>
            <input type="text" id="melEditReference" placeholder="e.g., MEL-25-11-01" style="width: 100%; padding: 10px; background: white; border: 1px solid #e2e8f0; color: #1e293b; border-radius: 6px;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; font-size: 13px; color: #64748b; font-weight: 600;">Expiry Date</label>
          <input type="date" id="melEditExpiry" style="width: 100%; padding: 10px; background: white; border: 1px solid #e2e8f0; color: #1e293b; border-radius: 6px;">
        </div>

        <div style="display: flex; gap: 10px;">
          <button onclick="ADCMSMCCCenter.saveMELEdit()" style="flex: 1; background: #f59e0b; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">Save MEL</button>
          <button onclick="ADCMSMCCCenter.closeMELModal()" style="flex: 1; background: #e2e8f0; color: #1e293b; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="modules/data.js"></script>
  <script src="modules/ui.js"></script>
  <script src="modules/mcc-center.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { if(window.ADCMSMCCCenter) window.ADCMSMCCCenter.init(); }, 500);
    });
  </script>
</body>
</html>

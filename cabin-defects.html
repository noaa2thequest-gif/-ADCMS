<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADCMS — Cabin Defects</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo-container">
          <img src="assets/img/logo.png" alt="Sky Vision Airlines" class="company-logo">
          <div class="brand-credits">
            <span class="designer">Designed by: Eng. Hany Omar</span>
            <span class="reviewer">Reviewed by: Eng. Akram El-Gendy</span>
          </div>
        </div>
      </div>
      <nav id="mainNav">
        <!-- Populated by ADCMSUI.renderNav() -->
      </nav>
    </aside>

    <main>
      <header>
        <button class="menu" id="menuBtn" style="display: block !important;">☰</button>
        <div class="profile"><div class="avatar">C</div><div><strong>Cabin Dept</strong><small>Maintenance</small></div></div>
      </header>

      <section class="content">
        <div class="section-head">
          <div>
            <h2>🪟 Cabin Maintenance & Defects</h2>
            <p style="color: #64748b; margin: 5px 0 0 0; font-size: 14px;">Managed routing from Cockpit/Crew entries</p>
          </div>
          <span id="cabinDefectCount" class="workflow-badge">0 items</span>
          <button onclick="ADCMSCabin.openAddModal()" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Log Cabin Issue</button>
        </div>

        <div id="cabinDefectList" class="defect-list" style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
          <!-- Cabin items will be rendered here -->
          <p style="text-align: center; padding: 40px; color: #888; grid-column: 1/-1;">Loading cabin defects...</p>
        </div>
      </section>
    </main>

    <!-- Modal for Cabin Action -->
    <div id="cabinActionModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
            <h3 id="cabinModalTitle" style="margin-top: 0; color: #1e293b;">Update Cabin Action</h3>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #64748b;">Action Taken</label>
                <textarea id="cabinActionText" rows="3" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-family: inherit;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #64748b;">Status</label>
                <select id="cabinStatusSelect" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: white;">
                    <option value="Open">Open</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="saveCabinAction" style="flex: 1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Save Update</button>
                <button onclick="document.getElementById('cabinActionModal').style.display='none'" style="flex: 1; background: #f1f5f9; color: #475569; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Modal for New Cabin Defect -->
    <div id="addCabinDefectModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
            <h3 style="margin-top: 0; color: #1e293b;">Log New Cabin Issue</h3>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #64748b;">Aircraft</label>
                <select id="cabinAircraftSelect" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: white;"></select>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #64748b;">Cabin Area / Seat</label>
                <input type="text" id="cabinAreaInput" placeholder="e.g., Seat 14C, Galley 2" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #64748b;">Issue Description</label>
                <textarea id="cabinIssueInput" rows="3" placeholder="Describe the defect..." style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-family: inherit;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #64748b;">Is this a MEL item?</label>
                <select id="cabinIsMEL" onchange="ADCMSCabin.toggleMELFields()" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: white;">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
            <div id="cabinMELFields" style="display: none; background: #fffbeb; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #fde68a;">
                <h4 style="margin-top: 0; color: #92400e; border-bottom: 1px solid #fde68a; padding-bottom: 8px; margin-bottom: 12px;">MEL Details</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #92400e;">Category</label>
                        <select id="cabinMELCategory" style="width: 100%; padding: 8px; border: 1px solid #fde68a; border-radius: 6px; background: white;">
                            <option value="A">Cat A</option>
                            <option value="B">Cat B</option>
                            <option value="C" selected>Cat C</option>
                            <option value="D">Cat D</option>
                            <option value="Connection 1">Connection 1</option>
                            <option value="Connection 2">Connection 2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #92400e;">MEL Reference</label>
                        <input type="text" id="cabinMELReference" placeholder="e.g., MEL-25-11-01" style="width: 100%; padding: 8px; border: 1px solid #fde68a; border-radius: 6px;">
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: #92400e;">Expiry Date</label>
                    <input type="date" id="cabinMELExpiry" style="width: 100%; padding: 8px; border: 1px solid #fde68a; border-radius: 6px;">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="ADCMSCabin.submitNewDefect()" style="flex: 1; background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Log Issue</button>
                <button onclick="document.getElementById('addCabinDefectModal').style.display='none'" style="flex: 1; background: #f1f5f9; color: #475569; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Cancel</button>
            </div>
        </div>
    </div>
  </div>

  <script src="modules/data.js"></script>
  <script src="modules/ui.js"></script>
  <script src="modules/cabin-defects.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if(window.ADCMSCabin) window.ADCMSCabin.init();
    });
  </script>
</body>
</html>
